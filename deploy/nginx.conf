# Nginx reverse proxy for exposing the RAG API on a VPS.
# Place it in /etc/nginx/sites-available/rag-system, then link it from sites-enabled.

server {
    listen 80;
    server_name votre-domaine.fr;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generation requests can take longer than ordinary API calls.
        proxy_read_timeout 120s;
    }
}

# After validating the configuration, enable HTTPS with certbot:
#   sudo certbot --nginx -d votre-domaine.fr
