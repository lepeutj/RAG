# Nginx reverse proxy for exposing the RAG demo on a VPS.
# Place it in /etc/nginx/sites-available/rag-system, then link it from sites-enabled.
limit_req_zone $binary_remote_addr zone=rag_query:10m rate=5r/m;

server {
    listen 80;
    server_name votre-domaine.fr;
    client_max_body_size 5m;

    location = /api/v1/query {
        limit_req zone=rag_query burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generation requests can take longer than ordinary API calls.
        proxy_read_timeout 120s;
    }
}

# After validating the configuration, enable HTTPS with certbot:
#   sudo certbot --nginx -d votre-domaine.fr
