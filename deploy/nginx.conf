# Reverse proxy nginx pour exposer l'API RAG sur le VPS.
# A placer dans /etc/nginx/sites-available/rag-system puis lier dans sites-enabled.

server {
    listen 80;
    server_name votre-domaine.fr;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # requêtes de génération potentiellement longues
        proxy_read_timeout 120s;
    }
}

# Une fois testé, activer HTTPS avec certbot:
#   sudo certbot --nginx -d votre-domaine.fr
